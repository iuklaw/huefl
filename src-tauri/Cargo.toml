[package]
name = "hue-tray"
version = "0.1.0"
description = "Control Philips Hue lights from the system tray"
edition = "2021"

[lib]
name = "hue_tray_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: the tray icon; image-png: decoding the embedded PNG tray icons.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls instead of OpenSSL: we need a custom certificate verifier (pinning).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
tokio = { version = "1", features = ["sync", "macros", "time", "process"] }
