[package]
name = "huefl"
version = "0.1.3"
description = "HueFL - Philips Hue for Linux"
license = "MIT"
repository = "https://github.com/iuklaw/huefl"
edition = "2021"

[lib]
name = "huefl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: the tray icon; image-png: decoding the embedded PNG tray icons.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls instead of OpenSSL: we need a custom certificate verifier (pinning).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
tokio = { version = "1", features = ["sync", "macros", "time", "process"] }
openssl = "0.10"
rustfft = "6.4"
libpulse-binding = { version = "2.30", optional = true }
libpulse-simple-binding = { version = "2.29", optional = true }
x11rb = { version = "0.14", features = ["shm", "randr"], optional = true }
libc = { version = "0.2", optional = true }
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screencast"], optional = true }
# 0.6 + libspa 0.6: the newest that build against PipeWire 0.3.48 headers
# (Ubuntu 22.04); later libspa needs fields added in 0.3.6x. At run time any
# newer PipeWire works (the protocol is backwards compatible).
pipewire = { version = "0.6", optional = true }
libspa = { version = "=0.6.0", optional = true }
libspa-sys = { version = "0.8", optional = true }
tauri-plugin-updater = "2"
time = { version = "0.3", features = ["formatting"] }

[features]
default = ["sync-audio", "sync-screen", "sync-screen-wayland"]
# Music sync: system audio / microphone capture through PulseAudio (works on
# PipeWire too). Needs libpulse-dev to build; without it, music mode is off.
sync-audio = ["dep:libpulse-binding", "dep:libpulse-simple-binding"]
# Screen sync: X11 capture through MIT-SHM (pure-Rust x11rb, no libxcb).
sync-screen = ["dep:x11rb", "dep:libc"]
# Screen sync on Wayland: the xdg-desktop-portal ScreenCast + a PipeWire
# stream. Needs libpipewire-0.3-dev and libclang-dev to build.
sync-screen-wayland = ["sync-screen", "dep:ashpd", "dep:pipewire", "dep:libspa", "dep:libspa-sys"]
